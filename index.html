<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毛泽东诗词地图 · 诗踪行迹</title>
<link rel="stylesheet" href="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --paper:#f3ead3; --paper-deep:#ece0c4; --ink:#2e2a24; --ink-light:#5c5346;
  --cinnabar:#9e2b22; --cinnabar-deep:#7a1f18; --ochre:#b5651d; --gold:#a8842c;
  --dai:#3d5a6c; --line:#d6c59e;
  /* 毛体：优先系统毛体，fallback 行楷（豪放舒展，接近毛体气势），再兜底楷体 */
  --maoti:"Maoti","MaoTi","毛泽东行书","方正毛体","FZMaoTi","STXingkai","华文行楷","行楷","KaiTi","STKaiti",serif;
  /* 瘦金体：优先系统瘦金体，fallback 楷体保证可读 */
  --shoujin:"STShouJinTi","瘦金体","FZShouJinShu","方正瘦金书","DFPShouJinW3","华康瘦金体","FZXiaoBiaoSong-B05S","KaiTi","STKaiti","Kaiti SC",serif;
  --kai:"STKaiti","KaiTi","Kaiti SC","Noto Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--shoujin);color:var(--ink);background:var(--paper)}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* ===== 头部：仿古笺 ===== */
header{background:linear-gradient(135deg,#6e1f18 0%,#9e2b22 55%,#a8542a 100%);color:#f7ecd4;
  padding:10px 18px 8px;box-shadow:0 2px 10px rgba(60,20,10,.35);border-bottom:2px solid var(--gold);z-index:800}
.head-row1{display:flex;align-items:center;gap:14px}
.title-wrap{flex:1;min-width:0}
header h1{font-size:22px;letter-spacing:5px;font-weight:700;font-family:var(--maoti);text-shadow:0 1px 3px rgba(0,0,0,.35);transform:skewX(-2deg);display:inline-block}
header .sub{font-size:12px;opacity:.88;margin-top:2px;letter-spacing:1px}
.seal{flex:none;width:44px;height:44px;border:2px solid rgba(247,236,212,.85);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:15px;line-height:1.15;font-weight:700;letter-spacing:2px;transform:rotate(-4deg);
  background:rgba(255,240,220,.12);box-shadow:inset 0 0 6px rgba(0,0,0,.25)}
/* 筛选条：独立一行，移动端横向滚动，避免与目录按钮交叉 */
.filter-bar{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-bar button{flex:none;border:1px solid rgba(247,236,212,.55);background:rgba(255,244,224,.12);color:#f7ecd4;
  padding:5px 13px;border-radius:15px;font-size:12.5px;cursor:pointer;font-family:var(--maoti);white-space:nowrap;letter-spacing:1px}
.filter-bar button.active{background:#f7ecd4;color:var(--cinnabar-deep);font-weight:700;border-color:#f7ecd4}

/* ===== 主体 ===== */
.body{flex:1;display:flex;position:relative;overflow:hidden}
#sidebar{width:300px;min-width:260px;background:var(--paper-deep);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px;z-index:650}
#sidebar h3{font-size:14px;color:var(--cinnabar-deep);border-bottom:1px dashed var(--gold);
  padding-bottom:7px;margin-bottom:10px;letter-spacing:2px;font-family:var(--maoti)}
.poem-item{padding:9px 11px;margin-bottom:7px;border-left:3px solid #ccc;background:#fbf4e2;
  border-radius:0 6px 6px 0;cursor:pointer;font-size:13px;line-height:1.55;box-shadow:0 1px 3px rgba(90,60,20,.12)}
.poem-item:hover{background:#f6e6c4}
.poem-item .t{font-weight:700;font-size:13.5px;letter-spacing:.5px;font-family:var(--maoti)}
.poem-item .m{font-size:11px;color:#8a744e;margin-top:3px;font-family:var(--shoujin)}

#map{flex:1;position:relative;background:var(--paper)}
/* 瓦片水墨滤镜：去艳色、转暖褐淡彩 */
.leaflet-tile-pane img.ink-tiles{filter:sepia(.42) saturate(.55) brightness(1.07) contrast(.92) hue-rotate(-12deg)}
/* 宣纸色罩层：压淡瓦片、统一暖纸色（位于瓦片之上、标记之下，不挡交互） */
#map::before{content:"";position:absolute;inset:0;z-index:450;pointer-events:none;
  background:linear-gradient(rgba(243,234,211,.40),rgba(243,234,211,.40));mix-blend-mode:multiply}
/* 宣纸纤维颗粒纹理 */
#map::after{content:"";position:absolute;inset:0;z-index:451;pointer-events:none;opacity:.45;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.26 0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
/* 角落诗句水印 */
.poem-watermark{position:absolute;bottom:70px;right:14px;z-index:490;pointer-events:none;
  writing-mode:vertical-rl;font-size:15px;letter-spacing:6px;color:rgba(122,31,24,.28);font-family:var(--shoujin)}

/* ===== 时间轴 ===== */
.timeline-bar{background:var(--paper-deep);border-top:1px solid var(--gold);padding:8px 16px;
  display:flex;align-items:center;gap:12px;font-size:13px;z-index:800}
.timeline-bar input[type=range]{flex:1;accent-color:var(--cinnabar)}
.timeline-bar button{background:var(--cinnabar);color:#f7ecd4;border:none;padding:6px 16px;border-radius:15px;
  cursor:pointer;font-family:var(--maoti);font-size:13px;letter-spacing:1px;white-space:nowrap}
.timeline-bar .yr{font-weight:700;color:var(--cinnabar-deep);min-width:96px;white-space:nowrap;font-family:var(--maoti)}

/* ===== 图例 ===== */
.legend{position:absolute;top:12px;right:12px;z-index:500;background:rgba(251,244,226,.94);
  padding:9px 13px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-family:var(--shoujin);
  box-shadow:0 2px 8px rgba(80,50,20,.18)}
.legend .lg-title{font-weight:700;color:var(--cinnabar-deep);margin-bottom:4px;letter-spacing:2px;font-size:12px}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.25)}

/* ===== 弹窗：卷轴笺纸 ===== */
.leaflet-popup-content-wrapper{background:#fbf4e2;border:1px solid var(--gold);border-radius:8px;
  box-shadow:0 4px 16px rgba(80,40,10,.3)}
.leaflet-popup-tip{background:#fbf4e2;border:1px solid var(--gold)}
.popup-poem{font-family:var(--shoujin);min-width:250px;max-width:310px;padding:2px 4px}
.popup-poem h4{color:var(--cinnabar-deep);font-size:17px;margin-bottom:5px;letter-spacing:1px;font-family:var(--maoti);
  border-bottom:1px dashed var(--gold);padding-bottom:5px}
.popup-poem .meta{font-size:11px;color:#8a744e;margin-bottom:8px;letter-spacing:.5px}
.popup-poem .verse{white-space:pre-line;font-size:14px;line-height:2.0;color:#3a3228;font-family:var(--shoujin);
  background:rgba(255,255,255,.55);padding:9px 12px;border-radius:5px;margin-bottom:8px;
  border-left:3px solid var(--cinnabar)}
.popup-poem .bg{font-size:12px;line-height:1.75;color:#5c5346;font-family:var(--shoujin)}
.popup-poem .p-seal{display:inline-block;margin-top:8px;font-size:10px;color:var(--cinnabar);
  border:1px solid var(--cinnabar);border-radius:4px;padding:1px 6px;letter-spacing:2px;opacity:.75}

/* 点位悬停诗句提示 */
.poem-tip{background:#fbf4e2 !important;border:1px solid var(--gold) !important;
  box-shadow:0 2px 8px rgba(80,40,10,.25) !important;border-radius:6px !important;
  font-family:var(--shoujin) !important;color:var(--ink) !important;padding:5px 10px !important}
.poem-tip:before{display:none !important}
.poem-tip .tip-title{font-weight:700;color:var(--cinnabar-deep);font-size:13px;letter-spacing:1px;font-family:var(--maoti)}
.poem-tip .tip-line{font-size:11.5px;color:#5c5346;margin-top:2px;white-space:nowrap;font-family:var(--shoujin)}

/* ===== 移动端 ===== */
.toggle-btn{display:none}
@media(max-width:760px){
  header{padding:9px 12px 7px}
  header h1{font-size:18px;letter-spacing:3px}
  header .sub{font-size:11px}
  .seal{width:36px;height:36px;font-size:12px}
  .filter-bar{gap:6px;margin-top:7px}
  .filter-bar button{padding:4px 11px;font-size:12px}
  #sidebar{position:absolute;left:0;top:0;bottom:0;z-index:650;transform:translateX(-100%);
    transition:.25s;width:268px;box-shadow:4px 0 14px rgba(0,0,0,.3)}
  #sidebar.show{transform:translateX(0)}
  /* 目录按钮移至左下角，避开左上角缩放控件与顶部筛选条 */
  .toggle-btn{display:block;position:absolute;bottom:62px;left:12px;z-index:700;
    background:var(--cinnabar);color:#f7ecd4;border:1px solid var(--gold);padding:8px 15px;
    border-radius:16px;cursor:pointer;font-family:var(--maoti);font-size:13px;letter-spacing:2px;
    box-shadow:0 2px 8px rgba(80,30,10,.35)}
  .legend{top:8px;right:8px;padding:6px 9px;font-size:10.5px;max-width:132px}
  .legend .lg-title{font-size:10.5px}
  .legend div{margin:2px 0;gap:5px}
  .legend i{width:9px;height:9px}
  .poem-watermark{font-size:12px;bottom:66px;right:8px;letter-spacing:4px;opacity:.7}
  .timeline-bar{padding:6px 10px;gap:8px}
  .timeline-bar .yr{min-width:74px;font-size:12px}
  .timeline-bar button{padding:5px 12px;font-size:12px}
  .timeline-bar .hint{display:none}
  .leaflet-control-zoom{position:absolute !important;bottom:62px !important;right:12px !important;top:auto !important;left:auto !important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-row1">
      <div class="title-wrap">
        <h1>毛泽东诗词地图</h1>
        <div class="sub">独立寒秋 · 江山多娇 · 万水千山只等闲（共 <span id="totalCount"></span> 首主要作品）</div>
      </div>
      <div class="seal"><span>诗</span><span>踪</span></div>
    </div>
    <div class="filter-bar" id="filters"></div>
  </header>
  <div class="body">
    <aside id="sidebar">
      <h3>诗词目录 · 点击定位</h3>
      <div id="poemList"></div>
    </aside>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <div class="poem-watermark">踏遍青山人未老，风景这边独好</div>
    <button class="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('show')">☰ 目录</button>
  </div>
  <div class="timeline-bar">
    <button id="playBtn">▶ 播放行迹</button>
    <span class="yr" id="yearLabel">全部（1910—1965）</span>
    <input type="range" id="yearRange" min="1910" max="1965" value="1965" step="1">
    <span class="hint" style="font-size:11px;color:#8a744e">拖动按年份过滤</span>
  </div>
</div>
<script>
const DATA = {"meta": {"title": "毛泽东诗词地图", "description": "按创作时间与地点整理的毛泽东主要诗词数据，供交互地图使用", "coordinate_note": "坐标为创作地城市/遗址近似经纬度(GCJ-02)，用于地图点位展示", "updated": "2026-11-09"}, "periods": [{"key": "early", "name": "早期求索(1910-1927)", "color": "#6b4f8a"}, {"key": "soviet", "name": "井冈山与中央苏区(1927-1934)", "color": "#b03a2e"}, {"key": "longmarch", "name": "长征(1934-1935)", "color": "#d3832f"}, {"key": "northwest", "name": "陕北与延安(1935-1945)", "color": "#a04a2a"}, {"key": "war", "name": "解放战争(1945-1949)", "color": "#6e7b7d"}, {"key": "prc", "name": "建国后(1949-1965)", "color": "#3f7d63"}], "poems": [{"id": 1, "title": "七绝·改诗赠父亲", "genre": "七绝", "date": "1910年秋", "year": 1910, "period": "early", "location": "湖南湘潭韶山冲", "province": "湖南", "coords": [27.91, 112.53], "lines": ["孩儿立志出乡关，", "学不成名誓不还。", "埋骨何须桑梓地，", "人生无处不青山。"], "background": "17岁离开韶山到湘乡东山高等小学读书前，改写日本僧人月性诗夹在父亲账簿里，抒发走出乡关、求学立志的抱负。"}, {"id": 2, "title": "虞美人·枕上", "genre": "词", "date": "1921年", "year": 1921, "period": "early", "location": "湖南长沙", "province": "湖南", "coords": [28.19, 112.98], "lines": ["堆来枕上愁何状，江海翻波浪。", "夜长天色总难明，寂寞披衣起坐数寒星。", "晓来百念都灰烬，剩有离人影。", "一钩残月向西流，对此不抛眼泪也无由。"], "background": "写给妻子杨开慧的爱情词，是毛泽东少数婉约之作，作于新婚离别之际。"}, {"id": 3, "title": "沁园春·长沙", "genre": "词", "date": "1925年秋", "year": 1925, "period": "early", "location": "湖南长沙橘子洲", "province": "湖南", "coords": [28.2, 112.97], "lines": ["独立寒秋，湘江北去，橘子洲头。", "看万山红遍，层林尽染；漫江碧透，百舸争流。", "鹰击长空，鱼翔浅底，万类霜天竞自由。", "怅寥廓，问苍茫大地，谁主沉浮？", "携来百侣曾游，忆往昔峥嵘岁月稠。", "恰同学少年，风华正茂；书生意气，挥斥方遒。", "指点江山，激扬文字，粪土当年万户侯。", "曾记否，到中流击水，浪遏飞舟？"], "background": "离开韶山赴广州主持农民运动讲习所，途经长沙重游橘子洲，回忆青年求学岁月，抒发以天下为己任的豪情。"}, {"id": 4, "title": "菩萨蛮·黄鹤楼", "genre": "词", "date": "1927年春", "year": 1927, "period": "early", "location": "湖北武汉武昌黄鹤楼", "province": "湖北", "coords": [30.55, 114.31], "lines": ["茫茫九派流中国，沉沉一线穿南北。", "烟雨莽苍苍，龟蛇锁大江。", "黄鹤知何去？剩有游人处。", "把酒酹滔滔，心潮逐浪高！"], "background": "大革命风雨欲来、国共合作面临破裂之际，登黄鹤楼感时伤世，在低沉中透出昂扬斗志。"}, {"id": 5, "title": "西江月·秋收起义", "genre": "词", "date": "1927年9月", "year": 1927, "period": "soviet", "location": "江西修水（秋收起义爆发地）", "province": "江西", "coords": [29.04, 114.57], "lines": ["军叫工农革命，旗号镰刀斧头。", "匡庐一带不停留，要向潇湘直进。", "地主重重压迫，农民个个同仇。", "秋收时节暮云愁，霹雳一声暴动。"], "background": "纪实秋收起义，是毛泽东第一首军旅诗词；起义受挫后率部转向井冈山。"}, {"id": 6, "title": "西江月·井冈山", "genre": "词", "date": "1928年秋", "year": 1928, "period": "soviet", "location": "江西井冈山茨坪·黄洋界", "province": "江西", "coords": [26.57, 114.05], "lines": ["山下旌旗在望，山头鼓角相闻。", "敌军围困万千重，我自岿然不动。", "早已森严壁垒，更加众志成城。", "黄洋界上炮声隆，报道敌军宵遁。"], "background": "歌颂黄洋界保卫战以少胜多，记录井冈山根据地工农武装割据的战斗生活。"}, {"id": 7, "title": "清平乐·蒋桂战争", "genre": "词", "date": "1929年秋", "year": 1929, "period": "soviet", "location": "福建上杭", "province": "福建", "coords": [25.05, 116.42], "lines": ["风云突变，军阀重开战。", "洒向人间都是怨，一枕黄粱再现。", "红旗跃过汀江，直下龙岩上杭。", "收拾金瓯一片，分田分地真忙。"], "background": "利用蒋桂军阀混战之机进军闽西，开辟根据地、开展土地革命的纪实。"}, {"id": 8, "title": "采桑子·重阳", "genre": "词", "date": "1929年10月", "year": 1929, "period": "soviet", "location": "福建上杭", "province": "福建", "coords": [25.06, 116.43], "lines": ["人生易老天难老，岁岁重阳。", "今又重阳，战地黄花分外香。", "一年一度秋风劲，不似春光。", "胜似春光，寥廓江天万里霜。"], "background": "在闽西根据地重阳行军途中所作，于革命低潮中展现豁达乐观的胸襟。"}, {"id": 9, "title": "如梦令·元旦", "genre": "词", "date": "1930年1月", "year": 1930, "period": "soviet", "location": "闽赣行军途中（连城—广昌）", "province": "福建", "coords": [25.72, 116.75], "lines": ["宁化、清流、归化，路隘林深苔滑。", "今日向何方，直指武夷山下。", "山下，山下，风展红旗如画。"], "background": "率红四军从闽西向江西转战途中所作，勾勒行军路线与红旗如画的壮阔图景。"}, {"id": 10, "title": "减字木兰花·广昌路上", "genre": "词", "date": "1930年2月", "year": 1930, "period": "soviet", "location": "江西广昌", "province": "江西", "coords": [26.84, 116.33], "lines": ["漫天皆白，雪里行军情更迫。", "头上高山，风卷红旗过大关。", "此行何去？赣江风雪迷漫处。", "命令昨颁，十万工农下吉安。"], "background": "雪中行军向吉安进发，描绘红军凌厉气势与群众斗争声势。"}, {"id": 11, "title": "蝶恋花·从汀州向长沙", "genre": "词", "date": "1930年7月", "year": 1930, "period": "soviet", "location": "福建长汀（汀州）", "province": "福建", "coords": [25.83, 116.36], "lines": ["六月天兵征腐恶，万丈长缨要把鲲鹏缚。", "赣水那边红一角，偏师借重黄公略。", "百万工农齐踊跃，席卷江西直捣湘和鄂。", "国际悲歌歌一曲，狂飙为我从天落。"], "background": "记录红一军团从汀州向长沙进军，歌颂工农群众斗争的磅礴力量。"}, {"id": 12, "title": "渔家傲·反第一次大“围剿”", "genre": "词", "date": "1931年春", "year": 1931, "period": "soviet", "location": "江西永丰龙冈", "province": "江西", "coords": [26.78, 114.85], "lines": ["万木霜天红烂漫，天兵怒气冲霄汉。", "雾满龙冈千嶂暗，齐声唤，前头捉了张辉瓒。", "二十万军重入赣，风烟滚滚来天半。", "唤起工农千百万，同心干，不周山下红旗乱。"], "background": "第一次反“围剿”龙冈大捷、活捉敌师长张辉瓒后所作。"}, {"id": 13, "title": "渔家傲·反第二次大“围剿”", "genre": "词", "date": "1931年夏", "year": 1931, "period": "soviet", "location": "江西吉安东固", "province": "江西", "coords": [26.65, 115.43], "lines": ["白云山头云欲立，白云山下呼声急，", "枯木朽株齐努力。", "枪林逼，飞将军自重霄入。", "七百里驱十五日，赣水苍茫闽山碧，", "横扫千军如卷席。", "有人泣，为营步步嗟何及！"], "background": "第二次反“围剿”十五天横扫七百里、五战五捷的胜利纪实。"}, {"id": 14, "title": "菩萨蛮·大柏地", "genre": "词", "date": "1933年夏", "year": 1933, "period": "soviet", "location": "江西瑞金大柏地", "province": "江西", "coords": [25.88, 116.02], "lines": ["赤橙黄绿青蓝紫，谁持彩练当空舞？", "雨后复斜阳，关山阵阵苍。", "当年鏖战急，弹洞前村壁。", "装点此关山，今朝更好看。"], "background": "视察工作途经1929年激战过的大柏地，回忆战斗、赞叹根据地新貌。"}, {"id": 15, "title": "清平乐·会昌", "genre": "词", "date": "1934年夏", "year": 1934, "period": "soviet", "location": "江西会昌", "province": "江西", "coords": [25.59, 115.79], "lines": ["东方欲晓，莫道君行早。", "踏遍青山人未老，风景这边独好。", "会昌城外高峰，颠连直接东溟。", "战士指看南粤，更加郁郁葱葱。"], "background": "中央苏区第五次反“围剿”形势危急时所作，在郁闷中保持豪迈乐观，是苏区时期最后一首词。"}, {"id": 16, "title": "十六字令三首", "genre": "词", "date": "1934—1935年", "year": 1935, "period": "longmarch", "location": "长征途中（黔滇川山区）", "province": "贵州", "coords": [27.7, 106.93], "lines": ["山，快马加鞭未下鞍。惊回首，离天三尺三。", "山，倒海翻江卷巨澜。奔腾急，万马战犹酣。", "山，刺破青天锷未残。天欲堕，赖以拄其间。"], "background": "长征行军途中咏山三首，以群山象征红军顶天立地的气概。"}, {"id": 17, "title": "忆秦娥·娄山关", "genre": "词", "date": "1935年2月", "year": 1935, "period": "longmarch", "location": "贵州遵义娄山关", "province": "贵州", "coords": [27.99, 106.83], "lines": ["西风烈，长空雁叫霜晨月。", "霜晨月，马蹄声碎，喇叭声咽。", "雄关漫道真如铁，而今迈步从头越。", "从头越，苍山如海，残阳如血。"], "background": "遵义会议后二渡赤水、再克娄山关的战斗后所作，写出悲壮苍凉又坚定豪迈的转折心境。"}, {"id": 18, "title": "念奴娇·昆仑", "genre": "词", "date": "1935年10月", "year": 1935, "period": "longmarch", "location": "甘肃岷县岷山（遥望昆仑）", "province": "甘肃", "coords": [32.99, 103.83], "lines": ["横空出世，莽昆仑，阅尽人间春色。", "飞起玉龙三百万，搅得周天寒彻。", "夏日消溶，江河横溢，人或为鱼鳖。", "千秋功罪，谁人曾与评说？", "而今我谓昆仑：不要这高，不要这多雪。", "安得倚天抽宝剑，把汝裁为三截？", "一截遗欧，一截赠美，一截还东国。", "太平世界，环球同此凉热。"], "background": "翻越岷山雪山后遥望昆仑，抒发改造世界、实现大同的宏伟抱负。"}, {"id": 19, "title": "七律·长征", "genre": "七律", "date": "1935年10月", "year": 1935, "period": "longmarch", "location": "甘肃通渭（长征即将到达陕北）", "province": "甘肃", "coords": [35.22, 105.24], "lines": ["红军不怕远征难，万水千山只等闲。", "五岭逶迤腾细浪，乌蒙磅礴走泥丸。", "金沙水拍云崖暖，大渡桥横铁索寒。", "更喜岷山千里雪，三军过后尽开颜。"], "background": "中央红军长征即将胜利到达陕北时所作，以56字概括二万五千里征程，是长征史诗代表作。"}, {"id": 20, "title": "清平乐·六盘山", "genre": "词", "date": "1935年10月7日", "year": 1935, "period": "longmarch", "location": "宁夏固原六盘山", "province": "宁夏", "coords": [35.6, 106.24], "lines": ["天高云淡，望断南飞雁。", "不到长城非好汉，屈指行程二万。", "六盘山上高峰，红旗漫卷西风。", "今日长缨在手，何时缚住苍龙？"], "background": "翻越长征最后一座高山六盘山时吟成初稿（《长征谣》），后经多次修改定稿。"}, {"id": 21, "title": "六言诗·给彭德怀同志", "genre": "六言诗", "date": "1935年10月", "year": 1935, "period": "northwest", "location": "陕西吴起镇", "province": "陕西", "coords": [36.93, 108.17], "lines": ["山高路远坑深，大军纵横驰奔。", "谁敢横刀立马？唯我彭大将军！"], "background": "吴起镇切尾巴战斗胜利后，赠给指挥作战的彭德怀，赞其勇猛善战。"}, {"id": 22, "title": "沁园春·雪", "genre": "词", "date": "1936年2月", "year": 1936, "period": "northwest", "location": "陕西清涧县袁家沟", "province": "陕西", "coords": [37.12, 110.25], "lines": ["北国风光，千里冰封，万里雪飘。", "望长城内外，惟余莽莽；大河上下，顿失滔滔。", "山舞银蛇，原驰蜡象，欲与天公试比高。", "须晴日，看红装素裹，分外妖娆。", "江山如此多娇，引无数英雄竞折腰。", "惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。", "一代天骄，成吉思汗，只识弯弓射大雕。", "俱往矣，数风流人物，还看今朝。"], "background": "东征抗日前在袁家沟窑洞里观雪原所作；1945年重庆谈判时书赠柳亚子，公开发表后轰动全国。"}, {"id": 23, "title": "临江仙·给丁玲同志", "genre": "词", "date": "1936年12月", "year": 1936, "period": "northwest", "location": "陕西保安（今志丹）", "province": "陕西", "coords": [36.84, 108.07], "lines": ["壁上红旗飘落照，西风漫卷孤城。", "保安人物一时新。", "洞中开宴会，招待出牢人。", "纤笔一枝谁与似？三千毛瑟精兵。", "阵图开向陇山东。", "昨天文小姐，今日武将军。"], "background": "欢迎作家丁玲冲破封锁到达陕北，称赞其投身革命的转变。"}, {"id": 24, "title": "四言诗·祭黄帝陵", "genre": "四言诗", "date": "1937年4月5日", "year": 1937, "period": "northwest", "location": "陕西黄陵县桥山黄帝陵", "province": "陕西", "coords": [35.57, 109.26], "lines": ["赫赫始祖，吾华肇造；胄衍祀绵，岳峨河浩。", "聪明睿知，光被遐荒；建此伟业，雄立东方。", "……", "东等不才，剑屦俱奋；万里崎岖，为国效命。", "频年苦斗，备历险夷；匈奴未灭，何以家为。", "各党各界，团结坚固；不论军民，不分贫富。", "民族阵线，救国良方；四万万众，坚决抵抗。"], "background": "国共合作抗日前夕，代表中华苏维埃政府祭黄帝陵，申明团结抗日、民族救亡之志。"}, {"id": 25, "title": "七律·忆重庆谈判", "genre": "七律", "date": "1945年10月", "year": 1945, "period": "war", "location": "重庆红岩村", "province": "重庆", "coords": [29.56, 106.5], "lines": ["有田有地吾为主，无拒无降国步艰。", "……", "遍地哀鸿满城血，无非一念救苍生。"], "background": "抗战胜利后亲赴重庆谈判期间所作，表达为人民谋和平、救苍生的立场。"}, {"id": 26, "title": "五律·张冠道中", "genre": "五律", "date": "1947年", "year": 1947, "period": "war", "location": "陕西米脂张冠道", "province": "陕西", "coords": [37.77, 110.18], "lines": ["朝雾弥琼宇，征马嘶北风。", "露湿尘难染，霜笼鸦不惊。", "戎衣犹铁甲，须眉等银冰。", "踟蹰张冠道，恍若塞上行。"], "background": "转战陕北、撤离延安途中行军纪实，写严寒中坚持斗争的艰苦。"}, {"id": 27, "title": "五律·喜闻捷报", "genre": "五律", "date": "1947年秋", "year": 1947, "period": "war", "location": "陕西佳县", "province": "陕西", "coords": [38.03, 110.49], "lines": ["秋风度河上，大野入苍穹。", "佳令随人至，明月傍云生。", "故里鸿音绝，妻儿信未通。", "满宇频翘望，凯歌奏边城。"], "background": "转战陕北期间获悉前线捷报，在艰苦环境中翘盼胜利凯歌。"}, {"id": 28, "title": "七律·人民解放军占领南京", "genre": "七律", "date": "1949年4月", "year": 1949, "period": "prc", "location": "北京香山双清别墅", "province": "北京", "coords": [39.99, 116.19], "lines": ["钟山风雨起苍黄，百万雄师过大江。", "虎踞龙盘今胜昔，天翻地覆慨而慷。", "宜将剩勇追穷寇，不可沽名学霸王。", "天若有情天亦老，人间正道是沧桑。"], "background": "在香山获悉南京解放、国民党政权覆灭后所作，号召将革命进行到底。"}, {"id": 29, "title": "七律·和柳亚子先生", "genre": "七律", "date": "1949年4月29日", "year": 1949, "period": "prc", "location": "北京香山", "province": "北京", "coords": [39.98, 116.2], "lines": ["饮茶粤海未能忘，索句渝州叶正黄。", "三十一年还旧国，落花时节读华章。", "牢骚太盛防肠断，风物长宜放眼量。", "莫道昆明池水浅，观鱼胜过富春江。"], "background": "和柳亚子抒怀之作，劝勉其留在北京共商建国大计。"}, {"id": 30, "title": "浪淘沙·北戴河", "genre": "词", "date": "1954年夏", "year": 1954, "period": "prc", "location": "河北秦皇岛北戴河", "province": "河北", "coords": [39.83, 119.47], "lines": ["大雨落幽燕，白浪滔天，秦皇岛外打鱼船。", "一片汪洋都不见，知向谁边？", "往事越千年，魏武挥鞭，东临碣石有遗篇。", "萧瑟秋风今又是，换了人间。"], "background": "暑期在北戴河观海搏击风浪后所作，借曹操《观沧海》抒社会主义建设新时代的豪迈。"}, {"id": 31, "title": "水调歌头·游泳", "genre": "词", "date": "1956年6月", "year": 1956, "period": "prc", "location": "湖北武汉长江", "province": "湖北", "coords": [30.55, 114.32], "lines": ["才饮长沙水，又食武昌鱼。", "万里长江横渡，极目楚天舒。", "不管风吹浪打，胜似闲庭信步，今日得宽馀。", "子在川上曰：逝者如斯夫！", "风樯动，龟蛇静，起宏图。", "一桥飞架南北，天堑变通途。", "更立西江石壁，截断巫山云雨，高峡出平湖。", "神女应无恙，当惊世界殊。"], "background": "三次畅游长江后所作，畅想武汉长江大桥与三峡工程，歌颂建设宏图。"}, {"id": 32, "title": "七律二首·送瘟神", "genre": "七律", "date": "1958年7月1日", "year": 1958, "period": "prc", "location": "北京", "province": "北京", "coords": [39.9, 116.4], "lines": ["其一：绿水青山枉自多，华佗无奈小虫何！", "千村薜荔人遗矢，万户萧疏鬼唱歌。", "坐地日行八万里，巡天遥看一千河。", "牛郎欲问瘟神事，一样悲欢逐逝波。", "其二：春风杨柳万千条，六亿神州尽舜尧。", "红雨随心翻作浪，青山着意化为桥。", "天连五岭银锄落，地动三河铁臂摇。", "借问瘟君欲何往，纸船明烛照天烧。"], "background": "读江西余江县消灭血吸虫病的报道后，欣然命笔，新旧社会对比歌颂人民力量。"}, {"id": 33, "title": "七律·到韶山", "genre": "七律", "date": "1959年6月25日", "year": 1959, "period": "prc", "location": "湖南湘潭韶山冲", "province": "湖南", "coords": [27.91, 112.53], "lines": ["别梦依稀咒逝川，故园三十二年前。", "红旗卷起农奴戟，黑手高悬霸主鞭。", "为有牺牲多壮志，敢教日月换新天。", "喜看稻菽千重浪，遍地英雄下夕烟。"], "background": "阔别32年重返故乡韶山，走访乡亲、抚今追昔，赞颂人民革命精神。"}, {"id": 34, "title": "七律·登庐山", "genre": "七律", "date": "1959年7月1日", "year": 1959, "period": "prc", "location": "江西庐山牯岭", "province": "江西", "coords": [29.57, 115.99], "lines": ["一山飞峙大江边，跃上葱茏四百旋。", "冷眼向洋看世界，热风吹雨洒江天。", "云横九派浮黄鹤，浪下三吴起白烟。", "陶令不知何处去，桃花源里可耕田？"], "background": "庐山会议前夕登上庐山，远眺长江鄱阳湖，纵目天下、思考时局。"}, {"id": 35, "title": "七绝·为李进同志题所摄庐山仙人洞照", "genre": "七绝", "date": "1961年9月9日", "year": 1961, "period": "prc", "location": "江西庐山仙人洞", "province": "江西", "coords": [29.58, 115.98], "lines": ["暮色苍茫看劲松，乱云飞渡仍从容。", "天生一个仙人洞，无限风光在险峰。"], "background": "庐山工作会议期间为题照片而作，以劲松、险峰象征在困难形势下的坚定从容。"}, {"id": 36, "title": "卜算子·咏梅", "genre": "词", "date": "1961年12月", "year": 1961, "period": "prc", "location": "北京", "province": "北京", "coords": [39.9, 116.4], "lines": ["风雨送春归，飞雪迎春到。", "已是悬崖百丈冰，犹有花枝俏。", "俏也不争春，只把春来报。", "待到山花烂漫时，她在丛中笑。"], "background": "读陆游咏梅词反其意而用之，以梅花喻革命者不畏严寒、无私谦逊的品格。"}, {"id": 37, "title": "满江红·和郭沫若同志", "genre": "词", "date": "1963年1月9日", "year": 1963, "period": "prc", "location": "北京", "province": "北京", "coords": [39.9, 116.4], "lines": ["小小寰球，有几个苍蝇碰壁。", "嗡嗡叫，几声凄厉，几声抽泣。", "蚂蚁缘槐夸大国，蚍蜉撼树谈何易。", "正西风落叶下长安，飞鸣镝。", "多少事，从来急；天地转，光阴迫。", "一万年太久，只争朝夕。", "四海翻腾云水怒，五洲震荡风雷激。", "要扫除一切害人虫，全无敌。"], "background": "国际局势复杂时期和郭沫若词，抒发反帝反修、只争朝夕的战斗豪情。"}, {"id": 38, "title": "水调歌头·重上井冈山", "genre": "词", "date": "1965年5月", "year": 1965, "period": "prc", "location": "江西井冈山", "province": "江西", "coords": [26.57, 114.05], "lines": ["久有凌云志，重上井冈山。", "千里来寻故地，旧貌变新颜。", "到处莺歌燕舞，更有潺潺流水，高路入云端。", "过了黄洋界，险处不须看。", "风雷动，旌旗奋，是人寰。", "三十八年过去，弹指一挥间。", "可上九天揽月，可下五洋捉鳖，谈笑凯歌还。", "世上无难事，只要肯登攀。"], "background": "38年后重上井冈山，抚今追昔，抒发继续奋斗、勇攀高峰的壮志。"}, {"id": 39, "title": "念奴娇·井冈山", "genre": "词", "date": "1965年5月", "year": 1965, "period": "prc", "location": "江西井冈山", "province": "江西", "coords": [26.58, 114.04], "lines": ["参天万木，千百里，飞上南天奇岳。", "故地重来何所见，多了楼台亭阁。", "五井碑前，黄洋界上，车子飞如跃。", "江山如画，古代曾云海绿。", "弹指三十八年，人间变了，似天渊翻覆。", "犹记当时烽火里，九死一生如昨。", "独有豪情，天际悬明月，风雷磅礴。", "一声鸡唱，万怪烟消云落。"], "background": "与《水调歌头·重上井冈山》同期所作，回忆当年烽火、赞叹人间巨变。"}, {"id": 40, "title": "七律·洪都", "genre": "七律", "date": "1965年", "year": 1965, "period": "prc", "location": "江西南昌（洪都）", "province": "江西", "coords": [28.68, 115.89], "lines": ["到得洪都又一年，祖生击楫至今传。", "闻鸡久听南天雨，立马曾挥北地鞭。", "鬓雪飞来成废料，彩云长在有新天。", "年年后浪推前浪，江草江花处处鲜。"], "background": "途经南昌，借祖逖中流击楫典故抒怀，寄望后来者推动事业向前。"}]};

const periodMap={};DATA.periods.forEach(p=>periodMap[p.key]=p);
const shortName={early:'早期求索',soviet:'井冈山苏区',longmarch:'长征',northwest:'陕北延安',war:'解放战争',prc:'建国后'};

const map = L.map('map',{zoomControl:false}).setView([32.5,110],5);
L.control.zoom({position:'bottomright'}).addTo(map);
// 高德底图 + 水墨仿古滤镜（淡彩暖褐，贴合诗词意境）
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
  subdomains:['1','2','3','4'],maxZoom:18,className:'ink-tiles',attribution:'© 高德地图'
}).addTo(map);

let markersLayer = L.layerGroup().addTo(map);
let routeLayer = L.layerGroup().addTo(map);
let currentFilter='all', currentYear=1965, playing=false, playTimer=null;

function styleFor(p){return periodMap[p].color;}
function filteredPoems(){
  return DATA.poems.filter(p=>(currentFilter==='all'||p.period===currentFilter)&&p.year<=currentYear)
                   .sort((a,b)=>a.year-b.year||a.id-b.id);
}

function renderFilters(){
  const box=document.getElementById('filters');
  let html=`<button data-k="all" class="active">全部时期</button>`;
  DATA.periods.forEach(p=>{html+=`<button data-k="${p.key}">${shortName[p.key]||p.name}</button>`;});
  box.innerHTML=html;
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');currentFilter=b.dataset.k;render();
  });
}

function renderLegend(){
  const box=document.getElementById('legend');
  let html=`<div class="lg-title">时期图例</div><div><i style="background:#8a8378"></i>全部时期</div>`;
  DATA.periods.forEach(p=>{html+=`<div><i style="background:${p.color}"></i>${shortName[p.key]||p.name}</div>`;});
  box.innerHTML=html;
}

function popupHtml(p){
  return `<div class="popup-poem">
    <h4>${p.title}</h4>
    <div class="meta">${p.date} · ${p.location}（${p.province}）</div>
    <div class="verse">${p.lines.join('\n')}</div>
    <div class="bg">${p.background}</div>
    <span class="p-seal">诗 踪</span>
  </div>`;
}

function render(){
  markersLayer.clearLayers();routeLayer.clearLayers();
  const list=filteredPoems();
  list.forEach(p=>{
    const color=styleFor(p.period);
    const icon=L.divIcon({className:'',html:
      `<div style="position:relative;width:16px;height:16px">
         <div style="position:absolute;inset:0;border-radius:50%;background:${color};
           border:2px solid #fbf4e2;box-shadow:0 0 0 1px ${color},0 0 6px ${color}"></div>
       </div>`,iconSize:[16,16],iconAnchor:[8,8]});
    const m=L.marker(p.coords,{icon}).bindPopup(popupHtml(p),{maxWidth:320});
    m.bindTooltip(`<div class="tip-title">${p.title}</div><div class="tip-line">${p.lines[0]}</div>`,
      {direction:'top',offset:[0,-9],className:'poem-tip'});
    m.on('click',()=>m.openPopup());
    m.addTo(markersLayer);p._marker=m;
  });
  if(list.length>1){
    const latlngs=list.map(p=>p.coords);
    L.polyline(latlngs,{color:'#7a1f18',weight:1.8,opacity:.4,dashArray:'7 6'}).addTo(routeLayer);
  }
  renderList(list);
  document.getElementById('yearLabel').textContent=currentYear>=1965?'全部（1910—1965）':`≤ ${currentYear} 年`;
}

function renderList(list){
  const box=document.getElementById('poemList');
  box.innerHTML=list.map(p=>{
    const c=styleFor(p.period);
    return `<div class="poem-item" data-id="${p.id}" style="border-left-color:${c}">
      <div class="t">${p.title}</div>
      <div class="m">${p.date} · ${p.location}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.poem-item').forEach(el=>el.onclick=()=>{
    const p=DATA.poems.find(x=>x.id==el.dataset.id);
    map.flyTo(p.coords,8,{duration:.8});
    setTimeout(()=>p._marker&&p._marker.openPopup(),850);
    if(window.innerWidth<=760)document.getElementById('sidebar').classList.remove('show');
  });
}

document.getElementById('yearRange').oninput=e=>{currentYear=+e.target.value;stopPlay();render();};
function stopPlay(){playing=false;clearInterval(playTimer);document.getElementById('playBtn').textContent='▶ 播放行迹';}
document.getElementById('playBtn').onclick=()=>{
  if(playing){stopPlay();return;}
  playing=true;document.getElementById('playBtn').textContent='⏸ 暂停';
  currentYear=1910;document.getElementById('yearRange').value=1910;render();
  playTimer=setInterval(()=>{
    currentYear++;document.getElementById('yearRange').value=currentYear;render();
    if(currentYear>=1965)stopPlay();
  },650);
};

document.getElementById('totalCount').textContent=DATA.poems.length;
renderFilters();renderLegend();render();
</script>
</body>
</html>
